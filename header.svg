<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Crow - Agent Brain / Wrapper">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#020604"/>
      <stop offset="40%" stop-color="#040d09"/>
      <stop offset="100%" stop-color="#071610"/>
    </linearGradient>
    <radialGradient id="tealglow" cx="0.75" cy="0.45" r="0.58">
      <stop offset="0%" stop-color="#1ee0c8" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#14b8a6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambergow" cx="0.25" cy="0.55" r="0.42">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreglow" cx="0.5" cy="0.35" r="0.25">
      <stop offset="0%" stop-color="#ecfdf5" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <filter id="textsoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.72">
      <stop offset="55%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="accentbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="1"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leftfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#000" stop-opacity="0.22"/>
      <stop offset="25%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#space)"/>
  <rect width="1200" height="320" fill="url(#tealglow)"/>
  <rect width="1200" height="320" fill="url(#ambergow)"/>
  <rect width="1200" height="320" fill="url(#coreglow)"/>

  <!-- Feather/glint particulates -->
  <g fill="#5eead4">
    <circle cx="68" cy="48" r="1.3" opacity="0.75"/>
    <circle cx="190" cy="168" r="0.9" opacity="0.5"/>
    <circle cx="315" cy="72" r="1.4" opacity="0.8"/>
    <circle cx="435" cy="222" r="0.9" opacity="0.5"/>
    <circle cx="525" cy="68" r="1.1" opacity="0.65"/>
    <circle cx="610" cy="248" r="1.3" opacity="0.7"/>
    <circle cx="695" cy="88" r="0.8" opacity="0.5"/>
    <circle cx="770" cy="230" r="1.0" opacity="0.6"/>
    <circle cx="50" cy="240" r="1.0" opacity="0.55"/>
    <circle cx="975" cy="58" r="1.2" opacity="0.7"/>
    <circle cx="1060" cy="252" r="0.9" opacity="0.5"/>
    <circle cx="270" cy="270" r="1.1" opacity="0.6"/>
    <circle cx="475" cy="158" r="0.7" opacity="0.4"/>
    <circle cx="835" cy="128" r="1.2" opacity="0.65"/>
    <circle cx="145" cy="190" r="0.7" opacity="0.4"/>
    <circle cx="725" cy="270" r="0.8" opacity="0.5"/>
    <circle cx="395" cy="42" r="1.0" opacity="0.55"/>
    <circle cx="905" cy="190" r="0.8" opacity="0.45"/>
    <circle cx="113" cy="122" r="0.9" opacity="0.5"/>
    <circle cx="1110" cy="140" r="1.0" opacity="0.6"/>
  </g>

  <!-- Fine grid -->
  <g stroke="#14b8a6" stroke-width="0.35" opacity="0.04">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="260" y1="0" x2="260" y2="320"/>
    <line x1="520" y1="0" x2="520" y2="320"/>
    <line x1="780" y1="0" x2="780" y2="320"/>
    <line x1="1040" y1="0" x2="1040" y2="320"/>
  </g>

  <!-- Glint/Feather icon - refined -->
  <g transform="translate(1030,158) scale(3.2) translate(-16, -16)" opacity="0.75" fill="#1ee0c8">
    <path d="M16 2c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6-2.7-6-6-6zm0 10c-2.2 0-4-1.8-4-4s1.8-4 4-4 4 1.8 4 4-1.8 4-4 4z"/>
    <path d="M12 16c0-2.2 1.8-4 4-4s4 1.8 4 4-1.8 4-4 4-4-1.8-4-4zm0-8c-2.2 0-4 1.8-4 4s1.8 4 4 4 4-1.8 4-4-1.8-4-4-4z"/>
    <path d="M4 22c0-1.1.9-2 2-2h20c1.1 0 2 .9 2 2v4c0 1.1-.9 2-2 2H6c-1.1 0-2-.9-2-2v-4z"/>
    <path d="M8 14c0-1.1.9-2 2-2h12c1.1 0 2 .9 2 2v2c0 1.1-.9 2-2 2H10c-1.1 0-2-.9-2-2v-2z"/>
    <path d="M10 20c0-1.1.9-2 2-2h8c1.1 0 2 .9 2 2v2c0 1.1-.9 2-2 2H12c-1.1 0-2-.9-2-2v-2z"/>
    <path d="M12 8c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2v2c0 1.1-.9 2-2 2H14c-1.1 0-2-.9-2-2v-2z"/>
  </g>

  <!-- Concentric reticles -->
  <g fill="none" stroke="#14b8a6">
    <circle cx="1030" cy="158" r="88" stroke-width="0.5" opacity="0.12"/>
    <circle cx="1030" cy="158" r="96" stroke-width="0.3" opacity="0.07"/>
    <circle cx="1030" cy="158" r="104" stroke-width="0.2" opacity="0.04"/>
  </g>

  <!-- Title block -->
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" filter="url(#textsoft)" opacity="0.55">
    <text x="52" y="82" font-size="15" font-weight="500" fill="#020604" letter-spacing="5.5">[ HUNTER  ·  AWOKEN  ·  REEF  ·  SPIDER'S REACH ]</text>
    <text x="52" y="142" font-size="58" font-weight="700" fill="#020604" letter-spacing="1">CROW</text>
    <text x="52" y="188" font-size="17" font-weight="500" fill="#020604" letter-spacing="3.5">AGENT BRAIN  /  WRAPPER</text>
    <text x="54" y="218" font-size="13.5" font-weight="400" fill="#020604" letter-spacing="2.5">I REMEMBER. THAT'S THE PROBLEM.</text>
  </g>
  <g font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="52" y="82" font-size="15" font-weight="500" fill="#14b8a6" letter-spacing="5.5">[ HUNTER  ·  AWOKEN  ·  REEF  ·  SPIDER'S REACH ]</text>
    <text x="52" y="142" font-size="58" font-weight="700" fill="#f0fdfa" letter-spacing="1">CROW</text>
    <text x="52" y="188" font-size="17" font-weight="500" fill="#99f6e4" letter-spacing="3.5">AGENT BRAIN  /  WRAPPER</text>
    <text x="54" y="218" font-size="13.5" font-weight="400" fill="#a8a8a8" letter-spacing="2.5">I REMEMBER. <tspan x="148" fill="#2dd4bf">THAT'S THE PROBLEM.</tspan></text>
  </g>

  <rect x="52" y="160" width="320" height="1" fill="url(#accentbar)"/>

  <text transform="translate(1180, 236) rotate(-90)" font-family="'Haas Grot Disp Trial', 'Haas Grot Text Trial', 'Inter', sans-serif" font-size="6.5" font-weight="500" letter-spacing="1.2" fill="#14b8a6" opacity="0.18">THE REEF  ·  TANGLED SHORE  ·  DREAMING CITY</text>

  <g fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.35">
    <path d="M 20 42 L 20 20 L 42 20"/>
    <path d="M 1180 278 L 1180 300 L 1158 300"/>
  </g>

  <rect width="320" height="320" fill="url(#leftfade)"/>
  <rect width="1200" height="320" fill="url(#vig)" pointer-events="none"/>
</svg>